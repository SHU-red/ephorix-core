name: build-images

# Builds the two EphoriX images (api, web) on GHCR.
#
# Tagging scheme:
#   push to main      -> ghcr.io/shu-red/ephorix-{api,web}:dev-<short-sha>
#                        ghcr.io/shu-red/ephorix-{api,web}:dev-main (rolling)
#   tag vX.Y.Z        -> ghcr.io/shu-red/ephorix-{api,web}:latest
#                        ghcr.io/shu-red/ephorix-{api,web}:vX.Y.Z
#                        ghcr.io/shu-red/ephorix-{api,web}:X.Y
#
# `latest` is ONLY produced by release tags, never by main pushes.
# The timescaledb image is upstream and not built here.

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/shu-red/ephorix-api
  IMAGE_WEB: ghcr.io/shu-red/ephorix-web

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=dev-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Compute tags (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=dev-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
