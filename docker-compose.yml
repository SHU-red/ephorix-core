services:
  # --- Database: internal only. No host port — reachable exclusively from
  # the compose network (api connects via `db:5432`).
  db:
    image: timescale/timescaledb:${EPHORIX_TIMESCALE_TAG:-latest-pg16}
    container_name: ephorix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EPHORIX_DB_USER:-ephorix}
      POSTGRES_PASSWORD: ${EPHORIX_DB_PASSWORD:-ephorix}
      POSTGRES_DB: ${EPHORIX_DB_NAME:-ephorix}
    volumes:
      # The one and only volume. Named by default; set EPHORIX_PG_VOLUME to
      # an absolute host path for a bind mount. On RHEL/Fedora SELinux set
      # EPHORIX_VOLUME_MODE=z (shared) or =Z (private) for bind mounts.
      - ${EPHORIX_PG_VOLUME:-ephorix_pgdata}:/var/lib/postgresql/data${EPHORIX_VOLUME_MODE:+:${EPHORIX_VOLUME_MODE}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # --- API: internal only. No host port — reachable exclusively through the
  # web service's /api proxy.
  api:
    image: ${EPHORIX_API_IMAGE:-ghcr.io/shu-red/ephorix-api:latest}
    build:
      context: ./backend
    container_name: ephorix-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${EPHORIX_DATABASE_URL:-postgres://${EPHORIX_DB_USER:-ephorix}:${EPHORIX_DB_PASSWORD:-ephorix}@db:5432/${EPHORIX_DB_NAME:-ephorix}}
      EPHORIX_BIND: 0.0.0.0:3000
      RUST_LOG: ${EPHORIX_LOG_LEVEL:-info,ephorix_api=debug}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- Web: the ONLY exposed port. Serves the UI at / and proxies /api +
  # /healthz to the API (same-origin, no CORS). The watch uses this port as
  # its base URL too (POST /api/v1/health/batch, /api/v1/events/marker, ...).
  web:
    image: ${EPHORIX_WEB_IMAGE:-ghcr.io/shu-red/ephorix-web:latest}
    build:
      context: ./frontend
    container_name: ephorix-web
    restart: unless-stopped
    ports:
      - "${EPHORIX_WEB_PORT:-9000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Through nginx -> api -> db: proves the whole chain on the one port.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ephorix_pgdata:
