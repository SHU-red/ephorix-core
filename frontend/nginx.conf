server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/wasm application/json;

    # API + liveness probe -> ephorix-api (same compose network).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://api:3000;
    }

    # Content-addressed wasm bundles are safe to cache hard.
    location ~* \.wasm$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # JS/CSS include BOTH hashed bundles and un-hashed static assets
    # (uplot-bridge.js, uPlot.min.js, style.css) that change across deploys:
    # always revalidate, never cache immutably.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Entry HTML always revalidates so browsers pick up new hashed bundles
    # instead of serving a stale index referencing old JS/CSS.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
