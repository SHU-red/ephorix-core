[package]
name = "ephorix-ui"
version = "0.1.0"
edition = "2021"
description = "EphoriX web UI: black/red Spartan timeline of raw health metrics + Agoge sessions (Leptos CSR + uPlot)"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlDivElement",
    "HtmlInputElement",
    "HtmlSelectElement",
] }
gloo-net = { version = "0.6", features = ["http"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
